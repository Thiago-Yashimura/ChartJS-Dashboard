<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChartJS Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="padding: 50px">
    <h1 style="font-family: Arial, Helvetica, sans-serif;">Dashboard</h1>
   <div style="display: flex; justify-content: center; padding: 100px; gap:20px; border: solid 2px rgb(97, 97, 97);border-radius: 5px;">
    <div style="width: 600px;">
        <canvas id="myChart"></canvas>
    </div>

    <div style="width: 600px;">
        <canvas id="myChart2"></canvas>
    </div>
   </div> 
    

    
</body>

<script>
    const ctx = document.getElementById('myChart');
    const ctx2 = document.getElementById('myChart2');
   
  const labels = [
      '12:00',
      '13:00',
      '14:00',
      '15:00',
      '16:00',
      '17:00'
  ]
  const labelsMeses = [
      'Janeiro',
      'Fevereiro',
      'Março',
      'Abril',
      'Maio',
      'Junho'
    ]

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets:  [
      {
        label: 'Temperatura',
        data: [30, 29, 28, 25, 22, 23],
        borderWidth: 1
      },
      {
        label: 'Umidade',
        data: [80, 82, 80, 85, 80, 83],
        borderWidth: 1,
        
      }
    ]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });

   new Chart(ctx2, {
    type: 'bar',
    data: {
      labels: labelsMeses,
      datasets:  [
      {
        label: 'Temperatura Média',
        data: [22, 24, 27, 23, 20, 18],
        borderWidth: 1,
      },
      {
        label: 'Umidade Média',
        data: [90, 89, 93, 87, 88, 82],
        borderWidth: 1,
      }
    ]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
  
</script>

</html>
